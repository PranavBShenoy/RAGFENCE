
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: ragfence-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ragfence
      POSTGRES_USER: ragfence
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragfence -d ragfence"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
